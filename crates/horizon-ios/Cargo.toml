[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "horizon-ios: the iOS app with native Bedrock touch, GameController, and mouse+keyboard input"
publish = false

[lib]
name = "horizon_ios"
path = "src/lib.rs"

[[bin]]
name = "horizon-ios"
path = "src/main.rs"
test = false

[dependencies]
horizon-client-input = { path = "../horizon-client-input" }
horizon-core = { path = "../horizon-core" }
horizon-protocol = { path = "../horizon-protocol" }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "ios")'.dependencies]
horizon-game = { path = "../horizon-game" }
horizon-official = { path = "../horizon-official" }
winit = "0.30.13"
# Runs the game on a desktop-sized stack: iOS gives the main thread 1 MiB (src/main.rs).
stacker = "0.1"

[build-dependencies]
cc = "1"

[lints]
workspace = true
