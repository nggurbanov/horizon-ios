[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
# The app links Amethyst-iOS's touch controls (objc/, GPL-3.0): HORIZON-IOS.md.
license = "GPL-3.0-or-later"
rust-version.workspace = true
description = "horizon-ios: the iOS app, the official game with touch controls adapted from Amethyst-iOS"
publish = false

[[bin]]
name = "horizon-ios"
path = "src/main.rs"
test = false

[dependencies]
horizon-game = { path = "../horizon-game" }
horizon-official = { path = "../horizon-official" }
horizon-client-input = { path = "../horizon-client-input" }
winit = "0.30.13"

[build-dependencies]
cc = "1"

[lints]
workspace = true
