# horizon-ios: builds the iOS app and packages an IPA for sideloading (HORIZON-IOS.md).
# The IPA is ad-hoc signed: AltStore, SideStore, Sideloadly or TrollStore sign it for a device.
name: ios ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

# Runs don't cancel each other: a failed build still saves its compiled dependencies for the
# next one. Public-repo runner minutes are free.
concurrency:
  group: ios-ipa-${{ github.sha }}

permissions:
  contents: write

jobs:
  ipa:
    # The same build on GitHub's Apple Silicon and Intel Macs: the Apple Silicon pool often drops
    # queued jobs for lack of capacity, so whichever runs publishes. Same commit, same app.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios
          rustup default stable
          rustc --version
          xcodebuild -version
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-fast
          # Save the compiled dependencies even when the build fails, so the next run starts warm.
          cache-on-failure: true
      - name: Build
        run: |
          set -o pipefail
          cargo build --profile fast --target aarch64-apple-ios -p horizon-ios --keep-going --message-format short 2>&1 \
            | tee build.log | grep -E "^(error|warning: unused)|error\[|^\S+:[0-9]+:[0-9]+: error" || true
          test -f target/aarch64-apple-ios/fast/horizon-ios
          cargo run --locked -p cargo-horizon-mod -- wasm-std target/horizon-wasm-std.wasm
          test -f target/horizon-wasm-std.wasm
      - name: Errors
        if: failure()
        run: |
          grep -E "error" build.log | sort -u | head -150
          tail -80 build.log
      - name: Package
        run: |
          app=Payload/Horizon.app
          mkdir -p "$app"
          cp target/aarch64-apple-ios/fast/horizon-ios "$app/"
          cp target/horizon-wasm-std.wasm "$app/horizon-wasm-std.wasm"
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          SHORT_VERSION="$(python3 -c 'import sys; b = sys.argv[1]; print(f"0.{b[:8]}.{int(b[8:12])}")' "$BUILD_NUMBER")"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "SHORT_VERSION=$SHORT_VERSION" >> "$GITHUB_ENV"
          python3 - crates/horizon-ios/app/Info.plist "$app/Info.plist" "$SHORT_VERSION" "$BUILD_NUMBER" <<'PY'
          import plistlib, sys
          src, dst, short_ver, build_num = sys.argv[1:5]
          with open(src, "rb") as f:
              data = plistlib.load(f)
          data["CFBundleShortVersionString"] = short_ver
          data["CFBundleVersion"] = build_num
          with open(dst, "wb") as f:
              plistlib.dump(data, f, fmt=plistlib.FMT_BINARY)
          PY
          printf 'APPL????' > "$app/PkgInfo"
          src=packaging/icons/hicolor/512x512/apps/horizon.png
          for spec in "AppIcon60x60@2x.png 120" "AppIcon60x60@3x.png 180" "AppIcon76x76@2x~ipad.png 152"; do
            set -- $spec
            sips -z "$2" "$2" "$src" --out "$app/$1" > /dev/null
          done
          cp LICENSE "$app/LICENSE-Horizon.txt"
          codesign --force --sign - --entitlements crates/horizon-ios/app/entitlements.plist "$app"
          zip -qry Horizon.ipa Payload
          PREV_SOURCE=""
          if curl -fsSL "https://github.com/${{ github.repository }}/releases/download/ios-latest/source.json" -o prev-source.json 2>/dev/null; then
            PREV_SOURCE="prev-source.json"
          fi
          COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          NOTES="Horizon iOS ${SHORT_VERSION} (build ${BUILD_NUMBER}, commit ${GITHUB_SHA::10}): ${COMMIT_SUBJECT}"
          if [ -n "$PREV_SOURCE" ]; then
            python3 tools/ios_ota_source.py \
              --ipa Horizon.ipa \
              --download-url "https://github.com/${{ github.repository }}/releases/download/ios-latest/Horizon.ipa" \
              --out source.json \
              --repo "${{ github.repository }}" \
              --notes "$NOTES" \
              --prev-source "$PREV_SOURCE"
          else
            python3 tools/ios_ota_source.py \
              --ipa Horizon.ipa \
              --download-url "https://github.com/${{ github.repository }}/releases/download/ios-latest/Horizon.ipa" \
              --out source.json \
              --repo "${{ github.repository }}" \
              --notes "$NOTES"
          fi
          ls -la Horizon.ipa source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizon-ios-${{ matrix.runner }}
          path: |
            Horizon.ipa
            source.json
            build.log
      - name: Publish the latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/ios-latest/source.json"
          ENCODED_SOURCE_URL="$(python3 -c 'import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$SOURCE_URL")"
          notes=$(cat <<EOF
          Unofficial iOS build of Horizon **v${SHORT_VERSION}** (build \`${BUILD_NUMBER}\`, commit \`${GITHUB_SHA::10}\`, run ${{ github.run_number }}, ${{ matrix.runner }}).

          Unsigned for your device: install with Feather, SideStore, AltStore, Sideloadly or TrollStore. You need your own copy of Minecraft: Java Edition; see \`HORIZON-IOS.md\` for putting the game files on the device.

          ### OTA Repository (AltStore / SideStore / Feather Source v2)
          - **Source JSON:** \`${SOURCE_URL}\`
          - **Feather:** \`feather://source/${SOURCE_URL}\`
          - **SideStore:** \`sidestore://source?url=${ENCODED_SOURCE_URL}\`
          EOF
          )
          # Replace the IPA and OTA source manifest on the existing release: the job's token
          # can't create the tag (HTTP 403), so the release keeps its first tag and the notes name the build.
          gh release upload ios-latest Horizon.ipa source.json --clobber
          gh release edit ios-latest --notes "$notes"
