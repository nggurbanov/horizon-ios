# horizon-ios: builds the iOS app and packages an IPA for sideloading (HORIZON-IOS.md).
# The IPA is ad-hoc signed: AltStore, SideStore, Sideloadly or TrollStore sign it for a device.
name: ios ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

# Runs don't cancel each other: a failed build still saves its compiled dependencies for the
# next one. Public-repo runner minutes are free.
concurrency:
  group: ios-ipa-${{ github.sha }}

permissions:
  contents: write

jobs:
  ipa:
    # The same build on GitHub's Apple Silicon and Intel Macs: the Apple Silicon pool often drops
    # queued jobs for lack of capacity, so whichever runs publishes. Same commit, same app.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios
          rustup default stable
          rustc --version
          xcodebuild -version
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-fast
          # Save the compiled dependencies even when the build fails, so the next run starts warm.
          cache-on-failure: true
      - name: Build
        run: |
          set -o pipefail
          cargo build --profile fast --target aarch64-apple-ios -p horizon-ios --keep-going --message-format short 2>&1 \
            | tee build.log | grep -E "^(error|warning: unused)|error\[|^\S+:[0-9]+:[0-9]+: error" || true
          test -f target/aarch64-apple-ios/fast/horizon-ios
      - name: Errors
        if: failure()
        run: |
          grep -E "error" build.log | sort -u | head -150
          tail -80 build.log
      - name: Package
        run: |
          app=Payload/Horizon.app
          mkdir -p "$app"
          cp target/aarch64-apple-ios/fast/horizon-ios "$app/"
          sed "s/BUILD_NUMBER/${{ github.run_number }}/" crates/horizon-ios/app/Info.plist > "$app/Info.plist"
          plutil -convert binary1 "$app/Info.plist"
          printf 'APPL????' > "$app/PkgInfo"
          src=packaging/icons/hicolor/512x512/apps/horizon.png
          for spec in "AppIcon60x60@2x.png 120" "AppIcon60x60@3x.png 180" "AppIcon76x76@2x~ipad.png 152"; do
            set -- $spec
            sips -z "$2" "$2" "$src" --out "$app/$1" > /dev/null
          done
          cp LICENSE "$app/LICENSE-Horizon.txt"
          cp LICENSES/GPL-3.0.txt "$app/LICENSE-GPL-3.0.txt"
          codesign --force --sign - --entitlements crates/horizon-ios/app/entitlements.plist "$app"
          zip -qry Horizon.ipa Payload
          ls -la Horizon.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizon-ios-${{ matrix.runner }}
          path: |
            Horizon.ipa
            build.log
      - name: Publish the latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Unofficial iOS build of Horizon from ${GITHUB_SHA::10} (run ${{ github.run_number }}, ${{ matrix.runner }}). Unsigned for your device: install it with AltStore, SideStore, Sideloadly or TrollStore. You need your own copy of Minecraft: Java Edition; see HORIZON-IOS.md for putting the game files on the device."
          # Replace the IPA on the existing release: the job's token can't create the tag
          # (HTTP 403), so the release keeps its first tag and the notes name the build.
          gh release upload ios-latest Horizon.ipa --clobber
          gh release edit ios-latest --notes "$notes"
