# horizon-ios: builds the iOS app and packages an IPA for sideloading (HORIZON-IOS.md).
# The IPA is ad-hoc signed: AltStore, SideStore, Sideloadly or TrollStore sign it for a device.
name: ios ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Type-checks only (no code generation), beside the build: compile errors arrive in minutes,
  # not at the end of a full optimized build. Build scripts run, so C and Objective-C compile too.
  check:
    runs-on: macos-15
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target aarch64-apple-ios && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-check
          cache-on-failure: true
      - name: Check
        run: |
          set -o pipefail
          cargo check --target aarch64-apple-ios -p horizon-ios --keep-going --message-format short 2>&1 | tee check.log
      - name: Errors
        if: failure()
        run: grep -E "error" check.log | sort -u | head -200

  ipa:
    # GitHub's free macOS runner, or a faster one named in the IOS_RUNNER repository variable
    # (e.g. blacksmith-6vcpu-macos-26).
    runs-on: ${{ vars.IOS_RUNNER || 'macos-15' }}
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios
          rustup default stable
          rustc --version
          xcodebuild -version
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-fast
          # Save the compiled dependencies even when the build fails, so the next run starts warm.
          cache-on-failure: true
      - name: Build
        run: |
          set -o pipefail
          cargo build --profile fast --target aarch64-apple-ios -p horizon-ios --keep-going --message-format short 2>&1 \
            | tee build.log | grep -E "^(error|warning: unused)|error\[|^\S+:[0-9]+:[0-9]+: error" || true
          test -f target/aarch64-apple-ios/fast/horizon-ios
      - name: Errors
        if: failure()
        run: |
          grep -E "error" build.log | sort -u | head -150
          tail -80 build.log
      - name: Package
        run: |
          app=Payload/Horizon.app
          mkdir -p "$app"
          cp target/aarch64-apple-ios/fast/horizon-ios "$app/"
          sed "s/BUILD_NUMBER/${{ github.run_number }}/" crates/horizon-ios/app/Info.plist > "$app/Info.plist"
          plutil -convert binary1 "$app/Info.plist"
          printf 'APPL????' > "$app/PkgInfo"
          src=packaging/icons/hicolor/512x512/apps/horizon.png
          for spec in "AppIcon60x60@2x.png 120" "AppIcon60x60@3x.png 180" "AppIcon76x76@2x~ipad.png 152"; do
            set -- $spec
            sips -z "$2" "$2" "$src" --out "$app/$1" > /dev/null
          done
          cp LICENSE "$app/LICENSE-Horizon.txt"
          cp LICENSES/GPL-3.0.txt "$app/LICENSE-GPL-3.0.txt"
          codesign --force --sign - --entitlements crates/horizon-ios/app/entitlements.plist "$app"
          zip -qry Horizon.ipa Payload
          ls -la Horizon.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizon-ios
          path: |
            Horizon.ipa
            build.log
      - name: Publish the latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Unofficial iOS build of Horizon from ${GITHUB_SHA::10} (run ${{ github.run_number }}). Unsigned for your device: install it with AltStore, SideStore, Sideloadly or TrollStore. You need your own copy of Minecraft: Java Edition; see HORIZON-IOS.md for putting the game files on the device."
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-latest Horizon.ipa --prerelease --title "horizon-ios (latest)" --notes "$notes" --target "$GITHUB_SHA"
